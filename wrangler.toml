name = "delvers-descent"
main = "dist/main.js"
compatibility_date = "2025-06-01"
workers_dev = true

# `npm run deploy` runs tools/stage.js first: it copies the game into dist/site and writes a Worker that
# serves every file, bundled in as a binary module.
[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = false

# The playtest forum: one Durable Object with SQLite storage (worker/forum.js). The admin key is the Worker secret
# ADMIN_KEY, set with `node tools/forum.js key` (never committed).
[[durable_objects.bindings]]
name = "FORUM"
class_name = "Forum"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Forum"]
